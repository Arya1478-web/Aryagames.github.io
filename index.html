<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS GAME HUB</title><style>*{box-sizing:border-box}body{margin:0;background:#070a12;color:#fff;font-family:system-ui}header{text-align:center;padding:25px;background:linear-gradient(135deg,#141d45,#080b14)}h1{font-size:clamp(30px,8vw,58px);margin:0}.sub{color:#aeb8d0;margin:8px}.search{width:min(760px,94%);padding:14px;border-radius:14px;border:1px solid #354268;background:#11172a;color:#fff}.wrap{max-width:1200px;margin:auto;padding:15px}.cats{display:flex;gap:8px;overflow:auto;padding:5px 0 14px}.cat,.page{white-space:nowrap;padding:10px 14px;border-radius:999px;border:1px solid #303a5c;background:#11172a;color:#fff}.active{background:#6270ff!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#11172a;border:1px solid #293552;border-radius:17px;padding:16px;min-height:185px}.icon{font-size:38px}.num{font-size:12px;color:#71809f}.card h2{font-size:19px;margin:6px 0}.card p{color:#aab5ce;font-size:13px}.play,.gbtn{width:100%;padding:11px;border:0;border-radius:11px;background:#6270ff;color:#fff;font-weight:800}.pages{text-align:center;margin:20px}.modal{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center;padding:10px}.show{display:flex}.box{width:min(650px,100%);max-height:95vh;overflow:auto;background:#0d1221;border:1px solid #354268;border-radius:20px;padding:17px}.head{display:flex;justify-content:space-between}.close{background:#202a45;color:#fff;border:0;border-radius:10px;padding:10px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.stat{background:#172038;padding:8px;border-radius:9px}.area{min-height:330px;background:#0a0f1c;border-radius:14px;position:relative;padding:15px;display:flex;align-items:center;justify-content:center;flex-direction:column}.choice{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px}.choice button{min-width:65px;min-height:52px;border:0;border-radius:12px;background:#1a2440;color:#fff}.target{position:absolute;width:62px;height:62px;border:0;border-radius:50%;background:#ff5b78;color:#fff;font-weight:900}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:400px;width:100%}.tile{aspect-ratio:1;border:0;border-radius:9px;background:#18213a;color:#fff;font-size:28px;font-weight:900}.msg{text-align:center;color:#cbd4ec;min-height:25px}canvas{max-width:100%;background:#070a12;border-radius:13px}button{cursor:pointer}</style></head><body><header><h1>⚡ NEXUS GAME HUB</h1><div class='sub'><b>2,000 playable games</b> • 200 in every category</div><input id='search' class='search' placeholder='🔎 Search any game...'></header><div class='wrap'><div id='cats' class='cats'></div><div id='count'></div><div id='grid' class='grid'></div><div class='pages' id='pages'></div></div><div id='modal' class='modal'><div class='box'><div class='head'><h2 id='title'></h2><button class='close' id='close'>✕</button></div><div id='game'></div></div></div><script>
const cats=[['Racing','🏎️'],['Sports','🏀'],['Action','⚔️'],['Puzzle','🧩'],['Adventure','🗺️'],['Strategy','♟️'],['Arcade','👾'],['Cards & Board','🃏'],['Retro','👾'],['Family','👨‍👩‍👧']];const modes=['Tap Target','Reaction','Dodge','Catch','Timing','Memory','Sequence','Math','Color Match','Quick Choice','Grid Run','Lane Switch','Aim Shot','Stack','Avoider','Pattern','Click Rush','Word Scramble','High Low','Mini Boss'];const pref=['Neon','Turbo','Shadow','Crystal','Golden','Mega','Hyper','Royal','Pixel','Happy'];const suff=['Rush','Challenge','Quest','Master','Arena','Blitz','Dash','Match','Run','Showdown'];let games=[],id=1;cats.forEach(c=>{for(let m=0;m<20;m++)for(let v=1;v<=10;v++)games.push({id:id++,cat:c[0],icon:c[1],name:pref[v-1]+' '+suff[m%10]+' '+v+'-'+(m+1),mode:m});});let active='All',page=1,per=40;const grid=document.getElementById('grid'),search=document.getElementById('search');['All',...cats.map(x=>x[0])].forEach(c=>{let b=document.createElement('button');b.className='cat '+(c==='All'?'active':'');b.textContent=c;b.onclick=()=>{active=c;page=1;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};document.getElementById('cats').appendChild(b)});function list(){let q=search.value.toLowerCase();return games.filter(g=>(active==='All'||g.cat===active)&&(!q||(`${g.name} ${g.cat} ${modes[g.mode]}`).toLowerCase().includes(q)))}function render(){let a=list(),max=Math.max(1,Math.ceil(a.length/per));page=Math.min(page,max);document.getElementById('count').textContent=a.length+' games found • page '+page+' of '+max;grid.innerHTML='';a.slice((page-1)*per,page*per).forEach(g=>{let c=document.createElement('article');c.className='card';c.innerHTML=`<div><div class='icon'>${g.icon}</div><div class='num'>#${g.id} • ${g.cat}</div><h2>${g.name}</h2><p>${modes[g.mode]} • unique variant ${((g.id-1)%10)+1}</p></div><button class='play'>▶ PLAY</button>`;c.querySelector('.play').onclick=()=>launch(g);grid.appendChild(c)});let p=document.getElementById('pages');p.innerHTML='';if(max>1){let x=document.createElement('button');x.className='page';x.textContent='← Prev';x.disabled=page===1;x.onclick=()=>{page--;render()};p.appendChild(x);let s=document.createElement('span');s.textContent=' '+page+' / '+max+' ';p.appendChild(s);x=document.createElement('button');x.className='page';x.textContent='Next →';x.disabled=page===max;x.onclick=()=>{page++;render()};p.appendChild(x)}}search.oninput=()=>{page=1;render()};render();const modal=document.getElementById('modal'),game=document.getElementById('game'),title=document.getElementById('title');document.getElementById('close').onclick=()=>{modal.classList.remove('show');game.innerHTML=''};function open(g,h){title.textContent=g.icon+' '+g.name;game.innerHTML=h;modal.classList.add('show')}function restartBtn(){return `<button class='gbtn' id='restart'>RESTART</button>`}function launch(g){let f=[tap,reaction,dodge,catcher,timing,memory,sequence,math,color,choice,gridgame,lane,aim,stack,avoider,pattern,rush,word,highlow,boss][g.mode];f(g)}function tap(g){open(g,`<div class='stats'><div class='stat'>Score: <b id=s>0</b></div><div class='stat'>Time: <b id=t>20</b></div></div><div class=area id=a></div>${restartBtn()}`);let a=document.getElementById('a'),s=0,t=20,tm;function reset(){clearInterval(tm);s=0;t=20;spawn();tm=setInterval(()=>{document.getElementById('t').textContent=--t;if(t<=0)clearInterval(tm)},1000)}function spawn(){a.innerHTML='';let b=document.createElement('button');b.className='target';b.textContent='TAP';b.style.left=Math.random()*(a.clientWidth-62)+'px';b.style.top=Math.random()*250+'px';b.onclick=()=>{if(t>0){document.getElementById('s').textContent=++s;spawn()}};a.appendChild(b)}document.getElementById('restart').onclick=reset;reset()}function reaction(g){open(g,`<div class=stats><div class=stat>Hits: <b id=s>0</b></div></div><div class=area><button class=gbtn id=b>START</button><p id=m>Wait for GO.</p></div>${restartBtn()}`);let s=0,armed=0,tm;function reset(){clearTimeout(tm);armed=0;document.getElementById('b').disabled=false;document.getElementById('b').textContent='START';document.getElementById('m').textContent='Wait for GO.'}document.getElementById('b').onclick=()=>{if(!armed){document.getElementById('b').textContent='WAIT…';tm=setTimeout(()=>{armed=performance.now();document.getElementById('b').textContent='GO!',document.getElementById('b').onclick=()=>{if(armed){document.getElementById('s').textContent=++s;document.getElementById('m').textContent=Math.round(performance.now()-armed)+' ms';reset()}}},500+Math.random()*1500)}};document.getElementById('restart').onclick=reset;reset()}function dodge(g){open(g,`<div class=stats><div class=stat>Score: <b id=s>0</b></div></div><canvas id=c width=500 height=320></canvas><div class=choice><button id=l>◀</button><button id=r>▶</button></div>${restartBtn()}`);let c=document.getElementById('c'),x=c.getContext('2d'),px=250,o=[],s=0,over=0;document.getElementById('l').onclick=()=>px=Math.max(20,px-35);document.getElementById('r').onclick=()=>px=Math.min(480,px+35);document.getElementById('restart').onclick=()=>{px=250;o=[];s=0;over=0};function loop(){if(over)return;x.fillStyle='#080d18';x.fillRect(0,0,500,320);if(Math.random()<.04)o.push({x:10+Math.random()*480,y:-15});o.forEach(z=>z.y+=3+g.id%5*.2);o=o.filter(z=>{if(z.y>340)return false;if(z.y>275&&Math.abs(z.x-px)<25)over=1;return true});x.fillStyle='#5de4ff';x.fillRect(px-18,280,36,25);x.fillStyle='#ff5b78';o.forEach(z=>x.fillRect(z.x-12,z.y,24,24));document.getElementById('s').textContent=Math.floor(++s/8);if(!over)requestAnimationFrame(loop)}loop()}function catcher(g){open(g,`<div class=stats><div class=stat>Score: <b id=s>0</b></div><div class=stat>Lives: <b id=l>3</b></div></div><canvas id=c width=500 height=320></canvas><div class=choice><button id=ll>◀</button><button id=rr>▶</button></div>${restartBtn()}`);let c=document.getElementById('c'),x=c.getContext('2d'),px=250,o=[],s=0,l=3,over=0;document.getElementById('ll').onclick=()=>px=Math.max(35,px-35);document.getElementById('rr').onclick=()=>px=Math.min(465,px+35);document.getElementById('restart').onclick=()=>{px=250;o=[];s=0;l=3;over=0};function loop(){if(over)return;x.fillStyle='#0a0f1b';x.fillRect(0,0,500,320);if(Math.random()<.05)o.push({x:15+Math.random()*470,y:-10,b:Math.random()<.12});o.forEach(z=>z.y+=3);o=o.filter(z=>{if(z.y>310){l--;return false}if(z.y>270&&Math.abs(z.x-px)<40){z.b?l--:s++;return false}return true});x.fillStyle='#63e58d';x.fillRect(px-35,285,70,18);o.forEach(z=>{x.fillStyle=z.b?'#ff5470':'#ffd35a';x.beginPath();x.arc(z.x,z.y,12,0,7);x.fill()});document.getElementById('s').textContent=s;document.getElementById('l').textContent=l;if(l<=0)over=1;if(!over)requestAnimationFrame(loop)}loop()}function timing(g){open(g,`<div class=stats><div class=stat>Score: <b id=s>0</b></div></div><div class=area><div style="width:90%;height:30px;background:#18213a;border-radius:20px"><div id=p style="height:100%;width:10%;background:#63e58d;border-radius:20px"></div></div><button class=gbtn id=stop>STOP</button></div>${restartBtn()}`);let p=document.getElementById('p'),pos=5,dir=1,s=0,run=1;function tick(){if(!run)return;pos+=dir*1.7;if(pos>95||pos<5)dir*=-1;p.style.width=pos+'%';requestAnimationFrame(tick)}document.getElementById('stop').onclick=()=>{if(run){run=0;if(pos>40&&pos<60)s++;document.getElementById('s').textContent=s;setTimeout(()=>{run=1;tick()},300)}};document.getElementById('restart').onclick=()=>{s=0;pos=5;run=1;document.getElementById('s').textContent=0;tick()};tick()}function memory(g){open(g,`<div class=stats><div class=stat>Matches: <b id=s>0</b>/6</div></div><div class=tiles id=tiles></div><p id=m class=msg></p>${restartBtn()}`);let icons=['🍎','🚀','🐶','⚽','🌟','🍉'],deck,open=[],matched=new Set(),busy=0;function reset(){deck=[...icons,...icons].sort(()=>Math.random()-.5);open=[];matched=new Set();busy=0;draw()}function draw(){let z=document.getElementById('tiles');z.innerHTML='';deck.forEach((v,i)=>{let b=document.createElement('button');b.className='tile';b.textContent=open.includes(i)||matched.has(i)?v:'?';b.onclick=()=>flip(i);z.appendChild(b)})}function flip(i){if(busy||matched.has(i)||open.includes(i))return;open.push(i);draw();if(open.length===2){busy=1;setTimeout(()=>{if(deck[open[0]]===deck[open[1]]){matched.add(open[0]);matched.add(open[1]);document.getElementById('s').textContent=matched.size/2}else document.getElementById('m').textContent='Not a match.';open=[];busy=0;draw();if(matched.size===12)document.getElementById('m').textContent='🏆 Complete!'},450)}}document.getElementById('restart').onclick=reset;reset()}function sequence(g){open(g,`<div class=stats><div class=stat>Level: <b id=s>1</b></div></div><div class=area><h2 id=q></h2><div id=b class=choice></div></div>${restartBtn()}`);let seq=[],u=[],level=1,lock=1;document.getElementById('b').innerHTML=['🔴','🟢','🔵','🟡'].map((v,i)=>`<button data-i=${i}>${v}</button>`).join('');document.querySelectorAll('#b button').forEach(b=>b.onclick=()=>{if(lock)return;u.push(+b.dataset.i);if(u[u.length-1]!==seq[u.length-1]){lock=1;document.getElementById('q').textContent='❌ Wrong'}else if(u.length===seq.length){level++;document.getElementById('s').textContent=level;next()}});function next(){seq=Array.from({length:Math.min(3+level,8)},()=>Math.floor(Math.random()*4));u=[];lock=1;let i=0,tm=setInterval(()=>{document.getElementById('q').textContent=['🔴','🟢','🔵','🟡'][seq[i++]];if(i>=seq.length){clearInterval(tm);setTimeout(()=>{document.getElementById('q').textContent='GO';lock=0},400)}},400)}document.getElementById('restart').onclick=()=>{level=1;document.getElementById('s').textContent=1;next()};next()}function math(g){open(g,`<div class=stats><div class=stat>Score: <b id=s>0</b></div><div class=stat>Time: <b id=t>30</b></div></div><div class=area><h2 id=q></h2><input id=a inputmode=numeric style="padding:12px;border-radius:10px;background:#11172a;color:#fff;border:1px solid #344268"><button class=gbtn id=ok>ANSWER</button></div>${restartBtn()}`);let s=0,t=30,a,b,op,tm;function q(){a=2+Math.floor(Math.random()*9);b=1+Math.floor(Math.random()*9);op=['+','−','×'][g.id%3];document.getElementById('q').textContent=`${a} ${op} ${b} = ?`}function val(){return op==='+'?a+b:op==='−'?a-b:a*b}document.getElementById('ok').onclick=()=>{if(+document.getElementById('a').value===val())s++;document.getElementById('s').textContent=s;document.getElementById('a').value='';q()};document.getElementById('restart').onclick=()=>{clearInterval(tm);s=0;t=30;document.getElementById('s').textContent=0;document.getElementById('t').textContent=30;q();tm=setInterval(()=>{document.getElementById('t').textContent=--t;if(t<=0)clearInterval(tm)},1000)};document.getElementById('restart').click()}function color(g){open(g,`<div class=stats><div class=stat>Score: <b id=s>0</b></div></div><div class=area><h2 id=q></h2><div id=b class=choice></div></div>${restartBtn()}`);let colors=['RED','BLUE','GREEN','YELLOW'],s=0;function round(){let target=colors[Math.floor(Math.random()*4)];document.getElementById('q').textContent='TAP '+target;document.getElementById('b').innerHTML=colors.map(v=>`<button data-v=${v}>${v}</button>`).join('');document.querySelectorAll('#b button').forEach(b=>b.onclick=()=>{if(b.dataset.v===target)s++;document.getElementById('s').textContent=s;round()})}document.getElementById('restart').onclick=()=>{s=0;document.getElementById('s').textContent=0;round()};round()}function choice(g){open(g,`<div class=stats><div class=stat>Score: <b id=s>0</b></div></div><div class=area><div class=choice><button data-v=r>🪨</button><button data-v=p>📄</button><button data-v=s>✂️</button></div><p id=m></p></div>${restartBtn()}`);let score=0;document.querySelectorAll('#game [data-v]').forEach(b=>b.onclick=()=>{let ai=['r','p','s'][Math.floor(Math.random()*3)],u=b.dataset.v;if((u==='r'&&ai==='s')||(u==='p'&&ai==='r')||(u==='s'&&ai==='p'))score++;document.getElementById('s').textContent=score;document.getElementById('m').textContent=`You: ${u} • Hub: ${ai}`});document.getElementById('restart').onclick=()=>{score=0;document.getElementById('s').textContent=0}}function gridgame(g){open(g,`<div class=stats><div class=stat>Steps: <b id=s>0</b></div></div><div class=tiles id=g style="grid-template-columns:repeat(5,1fr)"></div><div class=choice><button data-d=u>⬆️</button><button data-d=l>⬅️</button><button data-d=d>⬇️</button><button data-d=r>➡️</button></div>${restartBtn()}`);let p=0,s=0;function draw(){let z=document.getElementById('g');z.innerHTML='';for(let i=0;i<25;i++){let d=document.createElement('div');d.className='tile';d.textContent=i===p?'🧭':i===24?'🏆':'';z.appendChild(d)}}document.querySelectorAll('#game [data-d]').forEach(b=>b.onclick=()=>{let r=Math.floor(p/5),c=p%5,n=p,d=b.dataset.d;if(d==='u'&&r)n-=5;if(d==='d'&&r<4)n+=5;if(d==='l'&&c)n--;if(d==='r'&&c<4)n++;p=n;s++;document.getElementById('s').textContent=s;draw()});document.getElementById('restart').onclick=()=>{p=0;s=0;document.getElementById('s').textContent=0;draw()};draw()}function lane(g){open(g,`<div class=stats><div class=stat>Score: <b id=s>0</b></div></div><canvas id=c width=420 height=430></canvas><div class=choice><button id=l>◀</button><button id=r>▶</button></div>${restartBtn()}`);let c=document.getElementById('c'),x=c.getContext('2d'),lane=1,o=[],s=0,over=0;document.getElementById('l').onclick=()=>lane=Math.max(0,lane-1);document.getElementById('r').onclick=()=>lane=Math.min(2,lane+1);document.getElementById('restart').onclick=()=>{lane=1;o=[];s=0;over=0};function loop(){if(over)return;x.fillStyle='#090e18';x.fillRect(0,0,420,430);if(Math.random()<.045)o.push({l:Math.floor(Math.random()*3),y:-30});o.forEach(z=>z.y+=4);o=o.filter(z=>{if(z.y>450)return false;if(z.y>380&&z.l===lane)over=1;return true});x.fillStyle='#5de4ff';x.fillRect(lane*140+45,380,50,40);x.fillStyle='#ff5b78';o.forEach(z=>x.fillRect(z.l*140+50,z.y,40,40));document.getElementById('s').textContent=Math.floor(++s/8);if(!over)requestAnimationFrame(loop)}loop()}function aim(g){tap(g)}function stack(g){timing(g)}function avoider(g){dodge(g)}function pattern(g){sequence(g)}function rush(g){let old=g;open(g,`<div class=stats><div class=stat>Clicks: <b id=s>0</b></div><div class=stat>Time: <b id=t>10</b></div></div><div class=area><button class=gbtn id=b style="font-size:30px">CLICK!</button></div>${restartBtn()}`);let s=0,t=10,tm;document.getElementById('b').onclick=()=>{if(t>0)document.getElementById('s').textContent=++s};document.getElementById('restart').onclick=()=>{clearInterval(tm);s=0;t=10;document.getElementById('s').textContent=0;document.getElementById('t').textContent=10;tm=setInterval(()=>{document.getElementById('t').textContent=--t;if(t<=0)clearInterval(tm)},1000)};document.getElementById('restart').click()}function word(g){choice(g)}function highlow(g){choice(g)}function boss(g){open(g,`<div class=stats><div class=stat>Boss HP: <b id=h>20</b></div><div class=stat>Hits: <b id=s>0</b></div></div><div class=area><div style="font-size:80px">👹</div><button class=gbtn id=b>ATTACK</button><p id=m>Defeat the boss.</p></div>${restartBtn()}`);let h=20,s=0;document.getElementById('b').onclick=()=>{if(h>0){h=Math.max(0,h-(1+g.id%4));s++;document.getElementById('h').textContent=h;document.getElementById('s').textContent=s;if(!h)document.getElementById('m').textContent='🏆 Boss defeated!'}};document.getElementById('restart').onclick=()=>{h=20;s=0;document.getElementById('h').textContent=20;document.getElementById('s').textContent=0}}
</script></body></html>
